<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運営者情報 | BOSTON METHOD</title>
    <meta name="description" content="BOSTON METHOD（希望周波数採用プログラム）の運営者情報・特定商取引法に基づく表記">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap');

        :root {
            --bg-color: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --accent-primary: #1E3A8A;
            --accent-gold: #B49647;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .font-serif-heading { font-family: 'Noto Serif JP', serif; }
        .font-sans-body { font-family: 'Noto Sans JP', sans-serif; }

        .text-gold-gradient {
            background: linear-gradient(135deg, #B49647 0%, #D4AF37 50%, #8A7020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // Icons
        const Award = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
        );

        const Building = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
        );

        const User = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        );

        const MapPin = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const Phone = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
        );

        const Mail = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        );

        const Clock = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const ArrowLeft = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        );

        // Navigation Component
        const Navigation = () => (
            <nav className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
                <div className="container mx-auto px-6 h-20 flex justify-between items-center">
                    <a href="index.html" className="flex items-center gap-3 text-[#0F172A] hover:opacity-80 transition-opacity">
                        <Award size={24} />
                        <span className="font-serif-heading font-bold text-lg tracking-wide" style={{color: '#B49647'}}>BOSTON METHOD</span>
                    </a>
                    <a href="index.html" className="flex items-center gap-2 text-[#64748B] hover:text-[#0F172A] transition-colors text-sm">
                        <ArrowLeft size={16} />
                        <span>トップに戻る</span>
                    </a>
                </div>
            </nav>
        );

        // Company Info Section
        const CompanyInfo = () => {
            const infoItems = [
                { icon: <Building size={24} />, label: "運営者名", value: "EZ企画合同会社" },
                { icon: <User size={24} />, label: "運営責任者", value: "坂田 雄司" },
                { icon: <MapPin size={24} />, label: "所在地", value: "大阪府大阪市中央区松屋町住吉5−7" },
                { icon: <Phone size={24} />, label: "電話番号", value: "050−1809−3922", note: "※お問い合わせはメールにてお願いいたします。" },
                { icon: <Mail size={24} />, label: "メールアドレス", value: "info@kibou-syuha-sp.site", isEmail: true },
            ];

            return (
                <section className="pt-32 pb-16 bg-white">
                    <div className="container mx-auto px-6">
                        <div className="max-w-3xl mx-auto">
                            {/* Header */}
                            <div className="text-center mb-12">
                                <h1 className="font-serif-heading text-3xl md:text-4xl font-black mb-4 text-[#0F172A]">
                                    運営者情報
                                </h1>
                                <p className="text-[#64748B] leading-relaxed">
                                    当サイトの運営者情報は以下の通りです。<br />
                                    ご不明な点やご質問がございましたら、記載のメールアドレスまでお気軽にお問い合わせください。
                                </p>
                            </div>

                            {/* Info Table */}
                            <div className="bg-[#F8FAFC] rounded-xl overflow-hidden border border-gray-100">
                                {infoItems.map((item, index) => (
                                    <div key={index} className={`flex flex-col md:flex-row ${index !== infoItems.length - 1 ? 'border-b border-gray-200' : ''}`}>
                                        <div className="md:w-48 bg-[#1E3A8A] text-white p-4 md:p-6 flex items-center gap-3">
                                            <span className="text-[#B49647]">{item.icon}</span>
                                            <span className="font-bold text-sm">{item.label}</span>
                                        </div>
                                        <div className="flex-1 p-4 md:p-6 bg-white">
                                            {item.isEmail ? (
                                                <a href={`mailto:${item.value}`} className="text-[#1E3A8A] hover:underline font-medium">
                                                    {item.value}
                                                </a>
                                            ) : (
                                                <span className="text-[#0F172A]">{item.value}</span>
                                            )}
                                            {item.note && (
                                                <p className="text-[#64748B] text-sm mt-2">{item.note}</p>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Links */}
                            <div className="mt-8 flex flex-col md:flex-row gap-4 justify-center">
                                <a href="privacy.html" className="inline-flex items-center justify-center  text-[#1E3A8A] px-6 py-3 rounded-lg font-bold hover:bg-[#1E3A8A] hover:text-white transition-colors">
                                    
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Contact Section
        const Contact = () => (
            <section className="py-16 bg-[#F8FAFC]">
                <div className="container mx-auto px-6">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white rounded-xl p-8 md:p-12 border border-gray-100 shadow-sm">
                            <div className="text-center">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-[#1E3A8A] text-white rounded-full mb-6">
                                    <Mail size={28} />
                                </div>
                                <h2 className="font-serif-heading text-2xl md:text-3xl font-black mb-4 text-[#0F172A]">
                                    お問い合わせ
                                </h2>
                                <p className="text-[#64748B] leading-relaxed mb-8">
                                    ご不明な点やご質問がございましたら、<br />
                                    下記のメールアドレスまでお気軽にお問い合わせください。
                                </p>

                                <a href="mailto:info@kibou-syuha-sp.site" className="inline-flex items-center gap-3 bg-[#B49647] text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-[#9A7D35] transition-colors shadow-lg">
                                    <Mail size={24} />
                                    <span>info@kibou-syuha-sp.site</span>
                                </a>

                                <div className="mt-10 space-y-3 text-left max-w-md mx-auto">
                                    <div className="flex items-start gap-3 text-[#64748B] text-sm">
                                        <Clock size={18} className="flex-shrink-0 mt-0.5" />
                                        <span>営業時間: 平日 10:00〜18:00（土日祝日を除く）</span>
                                    </div>
                                    <div className="flex items-start gap-3 text-[#64748B] text-sm">
                                        <Phone size={18} className="flex-shrink-0 mt-0.5" />
                                        <span>お電話でのお問い合わせは承っておりません。必ずメールにてご連絡ください。</span>
                                    </div>
                                    <div className="flex items-start gap-3 text-[#64748B] text-sm">
                                        <Mail size={18} className="flex-shrink-0 mt-0.5" />
                                        <span>お問い合わせへの回答には、2営業日程度いただく場合がございます。</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        // Footer Component
        const Footer = () => (
            <footer className="bg-[#0F172A] text-white py-12">
                <div className="container mx-auto px-6 text-center">
                    <div className="flex items-center justify-center gap-3 mb-4">
                        <Award size={20} />
                        <span className="font-serif-heading font-bold text-lg" style={{color: '#B49647'}}>BOSTON METHOD</span>
                    </div>
                    <p className="text-[#64748B] text-sm mb-2">
                        希望周波数採用プログラム
                    </p>
                    <div className="text-[#64748B] text-xs">
                        © 2024 BOSTON METHOD. ALL RIGHTS RESERVED.
                    </div>
                    <div className="mt-6 flex justify-center gap-6 text-xs text-[#64748B]">
                        <span className="text-white"></span>
                        <a href="privacy.html" className="hover:text-white transition-colors"></a>
                    </div>
                </div>
            </footer>
        );

        // Main App Component
        const App = () => {
            return (
                <main className="min-h-screen bg-white text-[#0F172A]">
                    <Navigation />
                    <CompanyInfo />
                    <Contact />
                    <Footer />
                </main>
            );
        };

        // Render App
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            console.log('✅ 運営者情報ページが正常にレンダリングされました');
        } catch (error) {
            console.error('❌ レンダリングエラー:', error);
        }
    </script>
</body>
</html>
